name: Déployer sur GitHub Pages

# Déploiement indépendant de Cloudflare Pages : les deux restent synchronisés
# automatiquement à chaque push sur main, mais avec deux bases d'URL
# différentes (voir vite.config.js / VITE_BASE_PATH).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Annule un déploiement en cours si un nouveau push arrive pendant qu'il tourne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Au niveau du job plutôt que d'une seule étape : les tests unitaires
    # importent src/lib/supabaseClient.js (même indirectement), qui sinon
    # retombe sur un placeholder et log un avertissement "variables
    # manquantes" dans les logs CI. Aucun test actuel n'appelle Supabase en
    # réseau, donc ça ne changeait rien au résultat — mais autant leur donner
    # les vraies valeurs pour des logs propres et rester correct si un futur
    # test en avait besoin.
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js (via realtime-js) exige le WebSocket natif
          # de Node.js, disponible seulement à partir de Node 22 — avec Node
          # 20, l'import de src/lib/supabaseClient.js plante au chargement et
          # fait échouer toute suite de test qui l'importe (même indirectement).
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Construire le site (base GitHub Pages)
        env:
          VITE_BASE_PATH: /arbre-memoire/
        run: npm run build

      - name: Copier index.html en 404.html
        # GitHub Pages n'a pas de "fallback SPA" natif : pour une URL comme
        # /arbre-memoire/individus/123, il renvoie 404.html, qui doit donc être
        # la même coquille d'application (React Router prend ensuite le relais
        # côté client, grâce au "basename" déjà configuré dans router.jsx).
        run: cp dist/index.html dist/404.html

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
